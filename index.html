<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Multi-Timezone Digital Clock</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <header>
            <h1>Multi-Timezone Digital Clock</h1>
            <p class="subtitle">Keep track of time across the world</p>
        </header>

        <main>
            <!-- Primary Clock Display -->
            <section class="primary-clock">
                <div class="clock-display">
                    <div class="time" id="primaryTime">00:00:00</div>
                    <div class="date" id="primaryDate">Loading...</div>
                    <div class="timezone-label">Local Time</div>
                </div>
            </section>

            <!-- Time Zone Manager -->
            <section class="timezone-manager">
                <h2>Add Time Zone</h2>
                <div class="add-timezone-form">
                    <select id="timezoneSelect" class="timezone-select">
                        <option value="">Select a timezone...</option>
                        <option value="America/New_York">New York (EST/EDT)</option>
                        <option value="America/Los_Angeles">Los Angeles (PST/PDT)</option>
                        <option value="America/Chicago">Chicago (CST/CDT)</option>
                        <option value="America/Denver">Denver (MST/MDT)</option>
                        <option value="Europe/London">London (GMT/BST)</option>
                        <option value="Europe/Paris">Paris (CET/CEST)</option>
                        <option value="Europe/Berlin">Berlin (CET/CEST)</option>
                        <option value="Europe/Moscow">Moscow (MSK)</option>
                        <option value="Asia/Tokyo">Tokyo (JST)</option>
                        <option value="Asia/Shanghai">Shanghai (CST)</option>
                        <option value="Asia/Hong_Kong">Hong Kong (HKT)</option>
                        <option value="Asia/Dubai">Dubai (GST)</option>
                        <option value="Asia/Singapore">Singapore (SGT)</option>
                        <option value="Asia/Kolkata">Mumbai (IST)</option>
                        <option value="Australia/Sydney">Sydney (AEDT/AEST)</option>
                        <option value="Pacific/Auckland">Auckland (NZDT/NZST)</option>
                        <option value="America/Sao_Paulo">São Paulo (BRT)</option>
                        <option value="America/Mexico_City">Mexico City (CST/CDT)</option>
                        <option value="Africa/Cairo">Cairo (EET)</option>
                        <option value="Africa/Johannesburg">Johannesburg (SAST)</option>
                    </select>
                    <button id="addTimezoneBtn" class="btn-add">
                        <span class="btn-icon">+</span> Add Zone
                    </button>
                </div>
            </section>

            <!-- World Clocks Grid -->
            <section class="world-clocks">
                <h2>World Clocks</h2>
                <div id="clocksContainer" class="clocks-grid">
                    <!-- Dynamic clock cards will be added here -->
                </div>
                <div id="emptyState" class="empty-state">
                    <svg class="empty-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor">
                        <circle cx="12" cy="12" r="10"></circle>
                        <polyline points="12 6 12 12 16 14"></polyline>
                    </svg>
                    <p>No world clocks added yet</p>
                    <p class="empty-hint">Select a timezone above to get started</p>
                </div>
            </section>
        </main>

        <footer>
            <p>Built with HTML, CSS, and JavaScript • Updates every second</p>
        </footer>
    </div>

    <script src="script.js"></script>
</body>
</html>
